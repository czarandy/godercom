<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packing List</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.6;
    background: #fafafa;
  }
  h1 { border-bottom: 2px solid #ddd; padding-bottom: 8px; }
  h2 { margin-top: 1.5em; color: #444; }
  h3 { color: #555; }
  ul { list-style: none; padding-left: 0; }
  li { padding: 4px 0; }
  label { cursor: pointer; user-select: none; }
  label input[type="checkbox"] {
    margin-right: 8px;
    width: 18px;
    height: 18px;
    vertical-align: middle;
    cursor: pointer;
  }
  label.checked { text-decoration: line-through; color: #999; }
  .reset-container { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; }
  .reset-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .reset-btn:hover { background: #c0392b; }
</style>
</head>
<body>
<div id="content"></div>
<div class="reset-container">
  <button class="reset-btn" onclick="resetState()">Reset All Checkboxes</button>
</div>

<script>
const STORAGE_KEY = 'packing-checklist-state';

const markdown = `
# Packing List

## Clothes
- [ ] T-shirts
- [ ] Pants / shorts
- [ ] Underwear
- [ ] Socks
- [ ] Pajamas
- [ ] Jacket / hoodie
- [ ] Swimsuit

## Toiletries
- [ ] Toothbrush & toothpaste
- [ ] Deodorant
- [ ] Shampoo / conditioner
- [ ] Sunscreen
- [ ] Medications

## Electronics
- [ ] Phone charger
- [ ] Laptop & charger
- [ ] Headphones
- [ ] Power bank

## Documents
- [ ] Passport / ID
- [ ] Tickets / boarding pass
- [ ] Insurance cards

## Misc
- [ ] Snacks
- [ ] Water bottle
- [ ] Sunglasses
- [ ] Book / kindle
`;

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function resetState() {
  localStorage.removeItem(STORAGE_KEY);
  render();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function render() {
  const state = loadState();
  const lines = markdown.trim().split('\n');
  let html = '';
  let checkboxIndex = 0;

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    // Headings
    const h1 = trimmed.match(/^# (.+)/);
    if (h1) { html += `<h1>${escapeHtml(h1[1])}</h1>`; continue; }
    const h2 = trimmed.match(/^## (.+)/);
    if (h2) { html += `<h2>${escapeHtml(h2[1])}</h2><ul>`; continue; }
    const h3 = trimmed.match(/^### (.+)/);
    if (h3) { html += `<h3>${escapeHtml(h3[1])}</h3>`; continue; }

    // Checkbox list item
    const cb = trimmed.match(/^- \[ \] (.+)/);
    if (cb) {
      const id = `cb-${checkboxIndex}`;
      const checked = state[id] || false;
      const checkedAttr = checked ? 'checked' : '';
      const checkedClass = checked ? 'checked' : '';
      html += `<li><label class="${checkedClass}"><input type="checkbox" data-id="${id}" ${checkedAttr}>${escapeHtml(cb[1])}</label></li>`;
      checkboxIndex++;
      continue;
    }

    // Regular list item
    const li = trimmed.match(/^- (.+)/);
    if (li) { html += `<li>${escapeHtml(li[1])}</li>`; continue; }

    // Paragraph
    html += `<p>${escapeHtml(trimmed)}</p>`;
  }
  html += '</ul>';

  document.getElementById('content').innerHTML = html;

  // Attach event listeners
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const state = loadState();
      const id = e.target.dataset.id;
      state[id] = e.target.checked;
      saveState(state);
      e.target.parentElement.classList.toggle('checked', e.target.checked);
    });
  });
}

render();
</script>
</body>
</html>
